[package]
name = "rz-app"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
rz-core = { path = "../rz-core" }
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[[bin]]
name = "RazerControl"
path = "src/main.rs"

[build-dependencies]

[target.'cfg(windows)'.build-dependencies]
